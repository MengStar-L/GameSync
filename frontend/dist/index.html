<body class="booting">
  <!-- 顶部带：品牌 + 导航 + 搜索 + 窗控（兼作无边框窗口标题栏） -->
  <header class="chrome" id="chrome">
    <div class="chrome-brand" id="brand">
      <span class="chrome-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="6"/></svg>
      </span>
      <span class="chrome-wordmark">GameSync</span>
    </div>

    <nav class="chrome-nav" id="chrome-nav" aria-label="主导航">
      <button class="chrome-tab" data-page="library">游戏库</button>
      <button class="chrome-tab" data-page="tags">标签</button>
      <button class="chrome-tab" data-page="accounts">云账号</button>
      <button class="chrome-tab" data-page="activity">动态</button>
      <button class="chrome-tab" data-page="settings">设置</button>
      <span class="chrome-tab-ink" id="chrome-tab-ink" aria-hidden="true"></span>
    </nav>

    <div class="chrome-gap" aria-hidden="true"></div>

    <div class="chrome-tools">
      <div class="chrome-search" id="chrome-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="chrome-search-input" placeholder="搜索游戏…" autocomplete="off" spellcheck="false" />
        <button class="chrome-search-clear" id="chrome-search-clear" aria-label="清空搜索">×</button>
      </div>
      <button class="chrome-sync" id="chrome-sync-all" title="同步全部游戏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <span>同步</span>
      </button>
      <div class="chrome-net" id="chrome-net" title="">
        <span class="chrome-net-dot"></span>
        <span class="chrome-net-text" id="chrome-net-text">检测中</span>
      </div>
    </div>

    <div class="window-controls">
      <button class="wc-btn" id="wc-min" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1" y1="6" x2="11" y2="6"/></svg>
      </button>
      <button class="wc-btn" id="wc-max" aria-label="最大化" title="最大化">
        <svg class="wc-icon-max" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="1.5" width="9" height="9" rx="2"/></svg>
        <svg class="wc-icon-restore" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="3.5" width="7" height="7" rx="1.8"/><path d="M4 1.6h4.6A1.8 1.8 0 0 1 10.4 3.4V8"/></svg>
      </button>
      <button class="wc-btn wc-close" id="wc-close" aria-label="关闭" title="关闭（最小化到托盘）">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><line x1="1.5" y1="1.5" x2="10.5" y2="10.5"/><line x1="10.5" y1="1.5" x2="1.5" y2="10.5"/></svg>
      </button>
    </div>
  </header>

  <!-- 视图挂载点：router 负责填充 -->
  <main id="view" class="view"></main>

  <!-- 全局层根节点：ui.js 使用 -->
  <div id="layer-toast" class="layer-toast"></div>
  <div id="layer-overlay" class="layer-overlay"></div>
  <div id="layer-menu" class="layer-menu"></div>

</body>
</html>
